
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON FRONTIER</title>
<style>
:root{--cyan:#55e7ff;--bg:#07101c;--panel:rgba(8,18,32,.94)}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:var(--bg);color:#eefaff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
button,input{font:inherit}
button{border:1px solid #55e7ff66;background:#11283c;color:#eafaff;padding:12px 16px;border-radius:10px;font-weight:700;cursor:pointer}
button:active{transform:scale(.97)}
input{background:#071522;color:white;border:1px solid #55e7ff66;padding:13px;border-radius:9px;width:100%;outline:none}
#roomMenu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#12324b,#050a12 72%);padding:18px}
.panel{width:min(430px,100%);padding:25px;background:var(--panel);border:1px solid #55e7ff55;border-radius:18px;box-shadow:0 0 45px #00c8ff16}
.logo{font-size:clamp(28px,7vw,43px);font-weight:900;letter-spacing:3px;color:var(--cyan);text-align:center;text-shadow:0 0 24px #00d9ff55}
.sub{text-align:center;color:#91b5c9;font-size:12px;letter-spacing:2px;margin:8px 0 22px}
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:#9fc8db;margin-bottom:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.primary{background:linear-gradient(120deg,#087eaa,#1551a1);border-color:#66eaff}
#menuError{color:#ff839d;font-size:13px;min-height:20px;margin-top:12px;text-align:center}
#hud{display:none;position:fixed;inset:0;pointer-events:none}
.hudtop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.hudcard{background:#06111cce;border:1px solid #55e7ff55;border-radius:10px;padding:9px 12px;font-size:12px;backdrop-filter:blur(8px)}
#roomCode{font-size:16px;color:var(--cyan);font-weight:bold;letter-spacing:2px}
#healthText{font-weight:bold}
#healthBar{width:130px;height:6px;background:#293b4a;border-radius:8px;margin-top:6px;overflow:hidden}
#healthFill{height:100%;width:100%;background:#4ade80}
#playersBox{position:absolute;right:12px;top:104px;width:160px;max-height:32vh;overflow:auto}
#playersList{font-size:11px;line-height:1.8;color:#d0e8f5}
#hudButtons{position:absolute;top:57px;left:12px;display:flex;gap:6px;pointer-events:auto}
.small{font-size:11px;padding:8px 10px}
#notice{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:#bcefff;text-shadow:0 2px 10px black;text-align:center}
#controls{position:absolute;inset:0}
#joystick{position:absolute;left:22px;bottom:24px;width:124px;height:124px;border:2px solid #55e7ff66;background:#06111c88;border-radius:50%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#55e7ff99;border:2px solid #c4f8ff;box-shadow:0 0 20px #00d9ff44}
#lookHint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:10px;color:#d5f5ff99;text-align:center;white-space:nowrap}
#fireButton{position:absolute;right:25px;bottom:35px;width:78px;height:78px;border-radius:50%;pointer-events:auto;background:#a51f4cbb;border:2px solid #ff80a6;font-size:12px}
#leaveButton{pointer-events:auto}
@media(min-width:800px){
 #joystick,#stick,#fireButton,#lookHint{display:none}
 #playersBox{top:80px}
}
@media(max-width:500px){
 .panel{padding:20px}
 #playersBox{width:122px;top:103px}
 #playersList{font-size:10px}
 .hudcard{padding:8px}
 #healthBar{width:90px}
}
</style>
</head>
<body>

<div id="roomMenu">
  <div class="panel">
    <div class="logo">NEON FRONTIER</div>
    <div class="sub">ONLINE COMBAT ARENA</div>
    <div class="field">
      <label>NAMA PEMAIN</label>
      <input id="nameInput" maxlength="16" placeholder="Contoh: Ranger01">
    </div>
    <div class="field">
      <label>KODE ROOM UNTUK BERGABUNG</label>
      <input id="codeInput" maxlength="6" placeholder="6 karakter" autocomplete="off">
    </div>
    <div class="actions">
      <button id="createButton" class="primary">CREATE ROOM</button>
      <button id="joinButton">JOIN ROOM</button>
    </div>
    <div id="menuError"></div>
    <div style="color:#7898aa;font-size:11px;line-height:1.6;text-align:center">
      Buat room lalu bagikan kodenya kepada temanmu.
    </div>
  </div>
</div>

<div id="hud">
  <div class="hudtop">
    <div class="hudcard">
      <div>HEALTH <span id="healthText">100</span></div>
      <div id="healthBar"><div id="healthFill"></div></div>
      <div style="margin-top:5px">KILLS: <span id="scoreText">0</span></div>
    </div>
    <div class="hudcard" style="text-align:center">
      <div style="font-size:10px;color:#91b5c9">ROOM CODE</div>
      <div id="roomCode">------</div>
      <button id="copyButton" class="small" style="margin-top:5px">SALIN KODE</button>
    </div>
  </div>

  <div id="hudButtons">
    <button id="leaveButton" class="small">KELUAR ROOM</button>
  </div>

  <div id="playersBox" class="hudcard">
    <b>PEMAIN DI ROOM</b>
    <div id="playersList">Menunggu data...</div>
  </div>

  <div id="notice">WASD untuk bergerak · Klik kanan + geser untuk memutar kamera</div>

  <div id="controls">
    <div id="joystick"><div id="stick"></div></div>
    <div id="lookHint">Geser layar untuk memutar kamera</div>
    <button id="fireButton">FIRE</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const socket = io({ autoConnect: true });

let myId = null;
let myPlayer = null;
let roomCode = null;
let inRoom = false;
let yaw = 0;
let pitch = 0.28;
let lastSend = 0;
let lastShot = 0;
let joystickId = null;
let lookPointer = null;
let lastLookX = 0;
let lastLookY = 0;
let moveX = 0;
let moveY = 0;
let fireHeld = false;
let lastFrame = 0;

const remotePlayers = new Map();
const remoteShots = new Map();
const keys = new Set();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07101c);
scene.fog = new THREE.Fog(0x07101c, 35, 100);

const camera = new THREE.PerspectiveCamera(
  70, innerWidth / innerHeight, 0.1, 250
);
camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;
document.body.insertBefore(renderer.domElement, $("roomMenu"));

scene.add(new THREE.HemisphereLight(0x9bdcff, 0x172033, 2.0));

const light = new THREE.DirectionalLight(0xffffff, 1.4);
light.position.set(12, 25, 10);
scene.add(light);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(90, 90),
  new THREE.MeshStandardMaterial({
    color: 0x101d2b,
    roughness: 0.85,
    metalness: 0.2
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.05;
scene.add(floor);

const grid = new THREE.GridHelper(84, 42, 0x1a90ad, 0x183044);
grid.position.y = 0.01;
scene.add(grid);

const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0x163347,
  emissive: 0x062638,
  metalness: 0.45,
  roughness: 0.5
});

function addWall(x, z, sx, sz) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, 2.5, sz),
    wallMaterial
  );
  mesh.position.set(x, 1.25, z);
  scene.add(mesh);
}

addWall(0, -43, 88, 2);
addWall(0, 43, 88, 2);
addWall(-43, 0, 2, 88);
addWall(43, 0, 2, 88);

for (let i = 0; i < 18; i++) {
  const a = i * 2.399;
  const r = 8 + (i % 5) * 5;
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(2.3, 1.5 + (i % 3), 2.3),
    new THREE.MeshStandardMaterial({
      color: i % 2 ? 0x17465a : 0x252d50,
      emissive: i % 2 ? 0x073040 : 0x10152e
    })
  );
  box.position.set(Math.cos(a) * r, box.geometry.parameters.height / 2, Math.sin(a) * r);
  box.rotation.y = a;
  scene.add(box);
}

const playerGeometry = new THREE.CapsuleGeometry(0.48, 1.0, 4, 8);

function createCharacter(data) {
  const group = new THREE.Group();
  const material = new THREE.MeshStandardMaterial({
    color: data.color || "#55e7ff",
    emissive: data.color || "#55e7ff",
    emissiveIntensity: 0.22,
    roughness: 0.45
  });

  const body = new THREE.Mesh(playerGeometry, material);
  body.position.y = 1.0;
  group.add(body);

  const visor = new THREE.Mesh(
    new THREE.BoxGeometry(0.48, 0.15, 0.12),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  visor.position.set(0, 1.45, -0.38);
  group.add(visor);

  scene.add(group);
  return group;
}

function setMyPosition(p) {
  if (!myPlayer) return;
  myPlayer.position.set(p.x, 0, p.z);
  myPlayer.rotation.y = p.rot || 0;
}

function addRemote(data) {
  if (!data || data.id === myId) return;

  let obj = remotePlayers.get(data.id);
  if (!obj) {
    obj = {
      mesh: createCharacter(data),
      target: { x: data.x, z: data.z, rot: data.rot || 0 },
      hp: data.hp ?? 100,
      name: data.name || "Ranger"
    };
    remotePlayers.set(data.id, obj);
  }

  obj.target.x = data.x;
  obj.target.z = data.z;
  obj.target.rot = data.rot || 0;
  obj.hp = data.hp ?? obj.hp;
  obj.name = data.name || obj.name;
}

function removeRemote(id) {
  const obj = remotePlayers.get(id);
  if (!obj) return;
  scene.remove(obj.mesh);
  disposeObject(obj.mesh);
  remotePlayers.delete(id);
}

function disposeObject(obj) {
  obj.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
      else child.material.dispose();
    }
  });
}

function clearGameObjects() {
  for (const id of [...remotePlayers.keys()]) removeRemote(id);
  for (const [id, shot] of remoteShots) {
    scene.remove(shot.mesh);
    shot.mesh.geometry.dispose();
    shot.mesh.material.dispose();
    remoteShots.delete(id);
  }
}

function showError(message) {
  $("menuError").textContent = message || "";
}

function playerName() {
  return $("nameInput").value.trim().slice(0, 16) || "Ranger";
}

$("createButton").addEventListener("click", () => {
  showError("");
  if (!socket.connected) {
    showError("Menghubungkan ke server...");
    socket.connect();
    return;
  }
  socket.emit("createRoom", { name: playerName() });
});

$("joinButton").addEventListener("click", () => {
  showError("");
  const code = $("codeInput").value.trim().toUpperCase();
  if (code.length !== 6) {
    showError("Masukkan kode room 6 karakter.");
    return;
  }
  if (!socket.connected) {
    showError("Menghubungkan ke server...");
    socket.connect();
    return;
  }
  socket.emit("joinRoom", { code, name: playerName() });
});

$("leaveButton").addEventListener("click", () => {
  if (inRoom) socket.emit("leaveRoom");
});

$("copyButton").addEventListener("click", async () => {
  if (!roomCode) return;
  try {
    await navigator.clipboard.writeText(roomCode);
    $("copyButton").textContent = "TERSALIN!";
  } catch {
    const field = document.createElement("textarea");
    field.value = roomCode;
    document.body.appendChild(field);
    field.select();
    document.execCommand("copy");
    field.remove();
    $("copyButton").textContent = "TERSALIN!";
  }
  setTimeout(() => $("copyButton").textContent = "SALIN KODE", 1300);
});

socket.on("connect", () => {
  showError("");
});

socket.on("disconnect", () => {
  if (inRoom) {
    showError("Koneksi terputus. Muat ulang halaman untuk masuk kembali.");
    exitToMenu();
  }
});

socket.on("roomError", message => showError(message));

socket.on("welcome", data => {
  myId = data.id;
  roomCode = data.roomCode;
  inRoom = true;

  if (myPlayer) {
    scene.remove(myPlayer);
    disposeObject(myPlayer);
  }

  myPlayer = createCharacter(data.player);
  setMyPosition(data.player);
  yaw = data.player.rot || 0;
  pitch = 0.28;

  $("roomMenu").style.display = "none";
  $("hud").style.display = "block";
  $("roomCode").textContent = roomCode;
  $("healthText").textContent = data.player.hp;
  $("healthFill").style.width = data.player.hp + "%";
  $("scoreText").textContent = data.player.score;
  showError("");
});

socket.on("world", data => {
  clearGameObjects();
  (data.players || []).forEach(addRemote);
  (data.shots || []).forEach(addShot);
});

socket.on("playerJoined", addRemote);
socket.on("playerMoved", addRemote);
socket.on("playerRespawn", addRemote);
socket.on("playerLeft", removeRemote);

socket.on("roomInfo", info => {
  $("roomCode").textContent = info.code;
  const list = $("playersList");
  list.innerHTML = "";

  (info.players || []).forEach(p => {
    const row = document.createElement("div");
    row.style.color = p.id === info.hostId ? "#55e7ff" : "#d0e8f5";
    row.textContent = (p.id === info.hostId ? "★ " : "• ") + p.name;
    list.appendChild(row);
  });

  if (!info.players || info.players.length === 0) {
    list.textContent = "Belum ada pemain";
  }
});

socket.on("playerHit", data => {
  if (data.target === myId) {
    $("healthText").textContent = data.hp;
    $("healthFill").style.width = data.hp + "%";
  }
  const obj = remotePlayers.get(data.target);
  if (obj) obj.hp = data.hp;
});

socket.on("playerDown", data => {
  if (data.id === myId) {
    $("notice").textContent = "Kamu tereliminasi! Respawn sebentar lagi...";
    setTimeout(() => {
      $("notice").textContent = "WASD untuk bergerak · Geser untuk melihat";
    }, 2000);
  }
  if (data.id !== myId) {
    const obj = remotePlayers.get(data.id);
    if (obj) obj.mesh.visible = false;
  }
  if (data.by === myId) {
    $("scoreText").textContent = data.score;
  }
});

socket.on("leaderboard", list => {
  if (!list) return;
  if (myId) {
    const me = list.find(p => p.id === myId);
    if (me) $("scoreText").textContent = me.score;
  }
});

socket.on("shotSpawn", addShot);
socket.on("shotRemove", removeShot);

socket.on("roomLeft", () => exitToMenu());

function exitToMenu() {
  inRoom = false;
  roomCode = null;
  myId = null;
  if (myPlayer) {
    scene.remove(myPlayer);
    disposeObject(myPlayer);
    myPlayer = null;
  }
  clearGameObjects();
  $("hud").style.display = "none";
  $("roomMenu").style.display = "flex";
  $("roomCode").textContent = "------";
  $("playersList").textContent = "Menunggu data...";
  showError("");
}

function addShot(data) {
  if (!data || remoteShots.has(data.id)) return;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 8, 8),
    new THREE.MeshBasicMaterial({ color: data.color || "#55e7ff" })
  );
  mesh.position.set(data.x, data.y || 1.35, data.z);
  scene.add(mesh);
  remoteShots.set(data.id, {
    mesh,
    data: { ...data },
    born: performance.now()
  });
}

function removeShot(id) {
  const shot = remoteShots.get(id);
  if (!shot) return;
  scene.remove(shot.mesh);
  shot.mesh.geometry.dispose();
  shot.mesh.material.dispose();
  remoteShots.delete(id);
}

function shoot() {
  if (!inRoom || !myPlayer || !myPlayer.visible) return;
  const now = performance.now();
  if (now - lastShot < 270) return;
  lastShot = now;

  const dx = -Math.sin(yaw);
  const dz = -Math.cos(yaw);
  socket.emit("shoot", { dx, dz });
}

$("fireButton").addEventListener("pointerdown", e => {
  e.preventDefault();
  fireHeld = true;
  shoot();
});
["pointerup", "pointercancel", "pointerleave"].forEach(eventName => {
  $("fireButton").addEventListener(eventName, () => fireHeld = false);
});

renderer.domElement.addEventListener("contextmenu", e => e.preventDefault());

renderer.domElement.addEventListener("pointerdown", e => {
  if (!inRoom || e.pointerType === "touch") return;
  if (e.button === 2 || e.button === 1) {
    lookPointer = e.pointerId;
    lastLookX = e.clientX;
    lastLookY = e.clientY;
    renderer.domElement.setPointerCapture(e.pointerId);
  } else if (e.button === 0) {
    shoot();
  }
});

renderer.domElement.addEventListener("pointermove", e => {
  if (e.pointerId !== lookPointer) return;
  const dx = e.clientX - lastLookX;
  const dy = e.clientY - lastLookY;
  lastLookX = e.clientX;
  lastLookY = e.clientY;
  yaw -= dx * 0.006;
  pitch = Math.max(-0.15, Math.min(0.75, pitch + dy * 0.004));
});

renderer.domElement.addEventListener("pointerup", e => {
  if (e.pointerId === lookPointer) lookPointer = null;
});

renderer.domElement.addEventListener("pointercancel", () => lookPointer = null);

$("joystick").addEventListener("pointerdown", e => {
  e.preventDefault();
  joystickId = e.pointerId;
  $("joystick").setPointerCapture(e.pointerId);
  updateJoystick(e);
});

$("joystick").addEventListener("pointermove", e => {
  if (e.pointerId === joystickId) updateJoystick(e);
});

function resetJoystick() {
  joystickId = null;
  moveX = 0;
  moveY = 0;
  $("stick").style.transform = "translate(0px,0px)";
}

["pointerup", "pointercancel", "lostpointercapture"].forEach(name => {
  $("joystick").addEventListener(name, resetJoystick);
});

function updateJoystick(e) {
  const rect = $("joystick").getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  let dx = e.clientX - centerX;
  let dy = e.clientY - centerY;
  const max = 36;
  const len = Math.hypot(dx, dy);
  if (len > max) {
    dx = dx / len * max;
    dy = dy / len * max;
  }
  moveX = dx / max;
  moveY = dy / max;
  $("stick").style.transform = `translate(${dx}px,${dy}px)`;
});

let touchLookId = null;

renderer.domElement.addEventListener("touchstart", e => {
  if (!inRoom) return;
  for (const touch of e.changedTouches) {
    if (touch.clientX < innerWidth * 0.35 || touch.clientY > innerHeight - 160) continue;
    touchLookId = touch.identifier;
    lastLookX = touch.clientX;
    lastLookY = touch.clientY;
  }
}, { passive: true });

renderer.domElement.addEventListener("touchmove", e => {
  for (const touch of e.changedTouches) {
    if (touch.identifier !== touchLookId) continue;
    const dx = touch.clientX - lastLookX;
    const dy = touch.clientY - lastLookY;
    lastLookX = touch.clientX;
    lastLookY = touch.clientY;
    yaw -= dx * 0.006;
    pitch = Math.max(-0.15, Math.min(0.75, pitch + dy * 0.004));
  }
}, { passive: true });

function endTouchLook(e) {
  for (const touch of e.changedTouches) {
    if (touch.identifier === touchLookId) touchLookId = null;
  }
}
renderer.domElement.addEventListener("touchend", endTouchLook, { passive: true });
renderer.domElement.addEventListener("touchcancel", endTouchLook, { passive: true });

window.addEventListener("keydown", e => {
  keys.add(e.code);
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
    e.preventDefault();
  }
});
window.addEventListener("keyup", e => keys.delete(e.code));
window.addEventListener("blur", () => {
  keys.clear();
  resetJoystick();
  fireHeld = false;
});

function updateMovement(dt) {
  if (!inRoom || !myPlayer || !myPlayer.visible) return;

  let forward = 0;
  let strafe = 0;

  if (keys.has("KeyW") || keys.has("ArrowUp")) forward += 1;
  if (keys.has("KeyS") || keys.has("ArrowDown")) forward -= 1;
  if (keys.has("KeyD") || keys.has("ArrowRight")) strafe += 1;
  if (keys.has("KeyA") || keys.has("ArrowLeft")) strafe -= 1;

  forward += -moveY;
  strafe += moveX;

  const mag = Math.hypot(forward, strafe);
  if (mag > 1) {
    forward /= mag;
    strafe /= mag;
  }

  const speed = keys.has("ShiftLeft") ? 10.5 : 7.0;
  const sin = Math.sin(yaw);
  const cos = Math.cos(yaw);

  const vx = (-sin * forward + cos * strafe) * speed * dt;
  const vz = (-cos * forward - sin * strafe) * speed * dt;

  myPlayer.position.x = THREE.MathUtils.clamp(myPlayer.position.x + vx, -40, 40);
  myPlayer.position.z = THREE.MathUtils.clamp(myPlayer.position.z + vz, -40, 40);
  myPlayer.rotation.y = yaw;

  const now = performance.now();
  if (now - lastSend > 50) {
    lastSend = now;
    socket.emit("move", {
      x: myPlayer.position.x,
      z: myPlayer.position.z,
      rot: yaw,
      moving: mag > 0.08
    });
  }

  if (fireHeld) shoot();
}

function updateCamera(dt) {
  if (!myPlayer) return;

  const distance = 6.2;
  const horizontal = Math.cos(pitch) * distance;
  const desired = new THREE.Vector3(
    myPlayer.position.x + Math.sin(yaw) * horizontal,
    myPlayer.position.y + 2.3 + Math.sin(pitch) * distance,
    myPlayer.position.z + Math.cos(yaw) * horizontal
  );

  // Delta-time damping keeps camera movement consistent across frame rates.
  const alpha = 1 - Math.exp(-7 * dt);
  camera.position.lerp(desired, alpha);

  const target = new THREE.Vector3(
    myPlayer.position.x,
    myPlayer.position.y + 1.25,
    myPlayer.position.z
  );
  camera.lookAt(target);
}

function updateRemotes(dt) {
  const alpha = 1 - Math.exp(-12 * dt);
  for (const obj of remotePlayers.values()) {
    obj.mesh.position.x = THREE.MathUtils.lerp(
      obj.mesh.position.x, obj.target.x, alpha
    );
    obj.mesh.position.z = THREE.MathUtils.lerp(
      obj.mesh.position.z, obj.target.z, alpha
    );

    let delta = obj.target.rot - obj.mesh.rotation.y;
    delta = Math.atan2(Math.sin(delta), Math.cos(delta));
    obj.mesh.rotation.y += delta * alpha;
  }
}

function updateShots() {
  const now = performance.now();

  for (const [id, shot] of remoteShots) {
    const d = shot.data;
    const age = (now - shot.born) / 1000;
    shot.mesh.position.x = d.x + d.dx * age * 22;
    shot.mesh.position.z = d.z + d.dz * age * 22;

    if (age > 1.7) {
      removeShot(id);
      continue;
    }

    if (!inRoom || !myPlayer || d.owner === myId) continue;

    const distance = Math.hypot(
      shot.mesh.position.x - myPlayer.position.x,
      shot.mesh.position.z - myPlayer.position.z
    );

    // The server still validates the room, shot ownership and target state.
    if (distance < 0.9) {
      // Client-side prediction is not used to damage the local player here.
    }
  }
}

function checkHits() {
  const now = performance.now();
  if (!inRoom || !myPlayer || !myPlayer.visible || now - lastShot < 0) return;

  for (const [shotId, shot] of remoteShots) {
    if (shot.data.owner !== myId) continue;
    const age = (now - shot.born) / 1000;
    const sx = shot.data.x + shot.data.dx * age * 22;
    const sz = shot.data.z + shot.data.dz * age * 22;

    for (const [targetId, obj] of remotePlayers) {
      if (!obj.mesh.visible) continue;
      const distance = Math.hypot(sx - obj.mesh.position.x, sz - obj.mesh.position.z);

      if (distance < 1.05) {
        socket.emit("hit", {
          target: targetId,
          shotId,
          x: sx,
          z: sz
        });
        removeShot(shotId);
        break;
      }
    }
  }
}

function animate(time) {
  requestAnimationFrame(animate);

  const dt = Math.min(0.05, Math.max(0, (time - (lastFrame || time)) / 1000));
  lastFrame = time;

  updateMovement(dt);
  updateRemotes(dt);
  updateCamera(dt);
  updateShots();
  checkHits();

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
});

})();
</script>
</body>
</html>
